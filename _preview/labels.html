<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../dist/index.css">
<style>body{margin:0;background:#2b2b2e;padding:24px;font-family:system-ui}
.annot-context-bar{position:static!important;display:inline-flex!important;width:auto!important;white-space:nowrap;margin-bottom:10px}</style>
</head><body><div class="annot-root" style="--annot-text:#e6e6e8;--annot-text-weak:#9a9aa0;--annot-border:rgba(255,255,255,.16);--annot-accent:#4f8cff;--annot-accent-soft:rgba(79,140,255,.18);--annot-panel:#2f3033;--annot-surface:#333438">
<div class="annot-context-bar">
<div class="annot-context__base"><button class="annot-context__tool" title="选择">◼</button></div>
<span class="annot-context__sep"></span><span class="annot-context__name">文本</span>
<span class="annot-context__sep"></span>
<span class="annot-context__label">类型</span>
<div class="annot-context__chips"><button class="annot-context__chip is-active">描边</button><button class="annot-context__chip">背景</button></div></div>
<div class="annot-context-bar">
<div class="annot-context__base"><button class="annot-context__tool" title="选择">◼</button></div>
<span class="annot-context__sep"></span><span class="annot-context__name">高亮</span>
<span class="annot-context__sep"></span>
<span class="annot-context__label">类型</span>
<div class="annot-context__chips"><button class="annot-context__chip is-active">画笔</button><button class="annot-context__chip">矩形</button></div></div>
<div class="annot-context-bar">
<div class="annot-context__base"><button class="annot-context__tool" title="选择">◼</button></div>
<span class="annot-context__sep"></span><span class="annot-context__name">尺寸注释</span>
<span class="annot-context__sep"></span>
<span class="annot-context__label">类型</span>
<div class="annot-context__chips"><button class="annot-context__chip is-active">长度</button><button class="annot-context__chip">角度</button></div></div>
<div class="annot-context-bar">
<div class="annot-context__base"><button class="annot-context__tool" title="选择">◼</button></div>
<span class="annot-context__sep"></span><span class="annot-context__name">聚光灯</span>
<span class="annot-context__sep"></span>
<span class="annot-context__label">类型</span>
<div class="annot-context__chips"><button class="annot-context__chip is-active">矩形</button><button class="annot-context__chip">椭圆</button></div></div>
<div class="annot-context-bar">
<div class="annot-context__base"><button class="annot-context__tool" title="选择">◼</button></div>
<span class="annot-context__sep"></span><span class="annot-context__name">放大镜</span>
<span class="annot-context__sep"></span>
<span class="annot-context__label">倍率</span>
<div class="annot-context__chips"><button class="annot-context__chip">2x</button><button class="annot-context__chip is-active">3x</button><button class="annot-context__chip">4x</button></div></div>
</div></body></html>
