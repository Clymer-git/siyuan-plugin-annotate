<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../dist/index.css">
<style>body{margin:0;background:#2b2b2e;padding:24px;font-family:system-ui}
.annot-context-bar{position:static!important;display:inline-flex!important;width:auto!important;white-space:nowrap;margin-bottom:10px}</style>
</head><body><div class="annot-root" style="--annot-text:#e6e6e8;--annot-text-weak:#9a9aa0;--annot-border:rgba(255,255,255,.16);--annot-accent:#4f8cff;--annot-accent-soft:rgba(79,140,255,.18);--annot-panel:#333438">
<div class="annot-context-bar">
<div class="annot-context__base"><button class="annot-context__tool">◼</button></div>
<span class="annot-context__sep"></span><span class="annot-context__name">马赛克</span>
<span class="annot-context__sep"></span><label class="annot-context__item"><span>块大小</span>
<input type="range" min="4" max="48" value="20"><b>20</b></label></div><div class="annot-context-bar">
<div class="annot-context__base"><button class="annot-context__tool">◼</button></div>
<span class="annot-context__sep"></span><span class="annot-context__name">模糊</span>
<span class="annot-context__sep"></span><label class="annot-context__item"><span>模糊程度</span>
<input type="range" min="2" max="40" value="12"><b>12</b></label></div><div class="annot-context-bar">
<div class="annot-context__base"><button class="annot-context__tool">◼</button></div>
<span class="annot-context__sep"></span><span class="annot-context__name">尺寸注释</span>
<span class="annot-context__sep"></span><span class="annot-context__label">类型</span>
<div class="annot-context__chips"><button class="annot-context__chip is-active">长度</button><button class="annot-context__chip">角度</button></div>
<label class="annot-context__item annot-context__item--select"><span>单位</span>
<select class="annot-context__select"><option>毫米 mm</option></select></label></div>
</div></body></html>
