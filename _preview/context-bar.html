<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../dist/index.css">
<style>body{margin:0;background:#2b2b2e;padding:40px;font-family:system-ui}
.annot-context-bar{position:static!important;display:inline-flex!important;width:auto!important;white-space:nowrap;margin-bottom:8px}
</style></head><body>
<div class="annot-root" style="--annot-text:#e6e6e8;--annot-border:rgba(255,255,255,.16);--annot-accent:#4f8cff;--annot-accent-soft:rgba(79,140,255,.18);--annot-panel:#2f3033">
<div class="annot-context-bar">
  <div class="annot-context__base">
    <button class="annot-context__tool is-active" title="选择">▣</button>
    <button class="annot-context__tool" title="平移">✋</button>
  </div>
  <span class="annot-context__sep"></span>
  <span class="annot-context__name">矩形</span>
  <span class="annot-context__sep"></span>
  <span class="annot-context__title">圆角</span>
  <button class="annot-corner-picker__button"><span class="annot-corner-picker__value">8</span></button>
</div>
<div style="height:14px"></div>
<div class="annot-context-bar">
  <div class="annot-context__base"><button class="annot-context__tool" title="选择">▣</button></div>
  <span class="annot-context__sep"></span>
  <span class="annot-context__name">画线</span>
  <span class="annot-context__sep"></span>
  <button class="annot-context__toggle is-active" title="圆头收口">圆线</button>
</div>
<div style="height:14px"></div>
<div class="annot-context-bar">
  <div class="annot-context__base"><button class="annot-context__tool" title="选择">▣</button></div>
  <span class="annot-context__sep"></span>
  <span class="annot-context__name">椭圆</span>
  <span class="annot-context__sep"></span>
  <span class="annot-context__hint">拖出椭圆</span>
</div>
</div></body></html>
