<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../dist/index.css">
<style>body{margin:0;background:#eceef1;padding:20px;font-family:system-ui}
.annot-root{position:static!important;background:#fff;border-radius:18px;display:inline-flex;padding:10px 14px;margin-left:0!important}
.annot-mobile-topbar{position:static!important;left:auto!important;top:auto!important;transform:none!important}
</style></head><body>
<div class="annot-root" style="--annot-text:#1f2329;--annot-text-weak:#8b9099;--annot-border:rgba(0,0,0,.12);--annot-accent:#3f6fff;--annot-accent-soft:#dfe7ff;--annot-panel:#fff">
  <div class="annot-mobile-topbar" style="position:static;display:flex;gap:6px">
    <button class="annot-mobile-topbar__btn"><svg class="annot-badge-icon" viewBox="0 0 40 26" width="40" height="26"><circle cx="20" cy="13" r="12" fill="#111"/><text x="20" y="18" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">1</text></svg><span>实心圆</span></button>
    <button class="annot-mobile-topbar__btn"><svg class="annot-badge-icon" viewBox="0 0 40 26"><path d="M20 1 L36 25 H4 Z" fill="#fff" stroke="#111" stroke-width="1.6"/><text x="20" y="21" text-anchor="middle" font-size="12" font-weight="700" fill="#111">1</text></svg><span>定位气泡</span></button>
    <button class="annot-mobile-topbar__btn"><span class="annot-mobile-topbar__char">1</span><span>纯数字</span></button>
    <button class="annot-mobile-topbar__btn"><svg class="annot-arrow-style-icon" viewBox="0 0 48 20"><line x1="4" y1="10" x2="36" y2="10" stroke="#111" stroke-width="2"/><path d="M36 5 L44 10 L36 15" fill="none" stroke="#111" stroke-width="2"/></svg><span>样式</span></button>
  </div>
</div></body></html>
